name: Restore and publish LightForge 1.6.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.6.0.yml'
      - 'migration/**'
      - 'releases/v1.6.0/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lightforge-1.6.0-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'CyberBASSLord-666/LightForge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Restore original source assets
        run: python3 migration/restore.py --only source
      - name: Verify original source snapshot
        run: python3 verify_snapshot.py
      - name: Commit restored assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'research/upstream/panns/Cnn6_mAP=0.343.pth' 'research/upstream/panns/MobileNetV2_mAP=0.383.pth' 'research/upstream/pretrained-sed/hf_dataset_gen/metadata/audioset_train_strong.csv' 'research/upstream/pretrained-sed/resources/frame_mn10_strong_1.pt' 'research/upstream/yamnet/yamnet.h5' 'web/analysis/models/beat-this-large.onnx' 'web/analysis/models/frame-mn10-singing.onnx' 'web/analysis/models/uvr-mdx-voc-ft.onnx'
          if ! git diff --cached --quiet; then
            git commit -m 'Restore verified LightForge 1.6.0 large assets'
            git push origin HEAD:main
          fi
          echo "LIGHTFORGE_RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Assemble original signed APK
        run: python3 migration/restore.py --only apk
      - name: Publish original release without overwriting
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.6.0 releases/v1.6.0/LightForge-1.6.0.apk releases/v1.6.0/SHA256SUMS.txt releases/v1.6.0/RELEASE_NOTES.md --target "$LIGHTFORGE_RELEASE_COMMIT" --title 'LightForge 1.6.0' --notes-file releases/v1.6.0/RELEASE_NOTES.md
