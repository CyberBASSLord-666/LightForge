name: LightForge 2.2.4 readiness diagnostic (not a release gate)
on:
  push:
    branches: ['diagnostics/2.2.4-readiness']
permissions:
  contents: read
  actions: read
concurrency:
  group: lightforge-2.2.4-readiness-diagnostic
  cancel-in-progress: true
jobs:
  readiness-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            .github
            android
            web
            tools
            tests
            qa
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned compile and signing tools
        run: python3 tools/bootstrap_toolchain.py
      - name: Verify pinned CI input and prepare diagnostic-only APKs
        id: prepare
        run: python3 tools/prepare_android_readiness_probe.py
      - name: Configure Android virtual-device paths
        run: |
          printf 'ANDROID_USER_HOME=%s\nANDROID_EMULATOR_HOME=%s\nANDROID_AVD_HOME=%s\n' "$RUNNER_TEMP/lightforge-android" "$RUNNER_TEMP/lightforge-android" "$RUNNER_TEMP/lightforge-android/avd" >> "$GITHUB_ENV"
      - name: Reclaim unused preinstalled toolchains on the disposable runner
        run: |
          sudo rm -rf -- "$ANDROID_HOME/ndk" /usr/share/dotnet
          df -h .
      - name: Prepare unchanged Android 15 emulator
        id: emulator
        run: |
          sudo chmod a+rw /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-35;google_apis;x86_64" "emulator"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name LightForge --package "system-images;android-35;google_apis;x86_64" --device pixel_6 --path "$ANDROID_AVD_HOME/LightForge.avd"
          test -f "$ANDROID_AVD_HOME/LightForge.ini"
          sed -i 's/^disk.dataPartition.size=.*/disk.dataPartition.size=6G/' "$ANDROID_AVD_HOME/LightForge.avd/config.ini"
          df -h "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          nohup "$ANDROID_HOME/emulator/emulator" -avd LightForge -no-window -no-audio -no-metrics -partition-size 6144 -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -cores 2 -camera-back none -camera-front none > emulator.log 2>&1 < /dev/null &
      - name: Run complete background suite with readiness evidence
        run: python3 tools/run_android_background_tests.py
      - name: Run complete crash recovery and export suite
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.emulator.outcome == 'success' }}
        run: python3 tools/run_android_diagnostics_tests.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lightforge-2.2.4-readiness-diagnostic-${{ github.run_id }}
          path: |
            qa/release-2.2.4/android-*
            diagnostic-input/*.json
            diagnostic-input/*.sha256
            emulator.log
          if-no-files-found: error
          retention-days: 30
