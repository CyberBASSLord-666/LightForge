name: Published analysis CPU capability diagnostic
on:
  push:
    branches: ['diagnostics/analysis-cpu']
permissions:
  contents: read
  actions: read
concurrency:
  group: lightforge-analysis-cpu-diagnostic
  cancel-in-progress: true
jobs:
  cpu-capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            .github
            android
            web
            tools
            tests
            qa
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned compile and signing tools
        run: python3 tools/bootstrap_toolchain.py
      - name: Verify published CI bytes and prepare signature-only diagnostic APKs
        run: python3 tools/prepare_analysis_cpu_probe.py
      - name: Configure Android virtual-device paths
        run: |
          printf 'ANDROID_USER_HOME=%s\nANDROID_EMULATOR_HOME=%s\nANDROID_AVD_HOME=%s\n' "$RUNNER_TEMP/lightforge-android" "$RUNNER_TEMP/lightforge-android" "$RUNNER_TEMP/lightforge-android/avd" >> "$GITHUB_ENV"
      - name: Reclaim unused toolchains on the disposable runner
        run: sudo rm -rf -- "$ANDROID_HOME/ndk" /usr/share/dotnet
      - name: Start API 35 emulator with four virtual CPU cores
        run: |
          sudo chmod a+rw /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-35;google_apis;x86_64" "emulator"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name LightForgeCpu --package "system-images;android-35;google_apis;x86_64" --device pixel_6 --path "$ANDROID_AVD_HOME/LightForgeCpu.avd"
          sed -i 's/^disk.dataPartition.size=.*/disk.dataPartition.size=6G/' "$ANDROID_AVD_HOME/LightForgeCpu.avd/config.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd LightForgeCpu -no-window -no-audio -no-metrics -partition-size 6144 -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -cores 4 -camera-back none -camera-front none > emulator.log 2>&1 < /dev/null &
      - name: Observe actual worker capabilities and initialize a tiny ONNX graph
        run: python3 tools/prepare_analysis_cpu_probe.py --run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lightforge-analysis-cpu-${{ github.run_id }}
          path: |
            diagnostic-input/analysis-cpu
            emulator.log
          if-no-files-found: error
          retention-days: 30
