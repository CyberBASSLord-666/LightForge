name: Android native recovery probe 2.2.1
on:
  push:
    branches: ['diagnostics/2.2.1-recovery']
    paths:
      - '.github/workflows/probe-android-2.2.1.yml'
      - 'tests/android/BackgroundInstrumentation.java'
      - 'tools/run_android_background_tests.py'
      - 'android/src/**/*.java'
      - 'build.sh'
      - 'tools/apk_archive.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: CyberBASSLord-666/LightForge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            android
            web
            tools
            tests
            qa
      - name: Verify the candidate build provenance
        run: |
          python3 - <<'PY'
          import json,subprocess
          def api(path):return json.loads(subprocess.check_output(['gh','api',path],text=True))
          run=api('repos/CyberBASSLord-666/LightForge/actions/runs/34162369481')
          assert run['head_sha']=='0527d778e1456ff607373a4c9ec546500b0153e5'
          assert run['head_repository']['full_name']=='CyberBASSLord-666/LightForge'
          assert run['path']=='.github/workflows/verify-v2.yml'
          jobs=api('repos/CyberBASSLord-666/LightForge/actions/runs/34162369481/jobs')['jobs']
          assert any(j['id']==101866643329 and j['name']=='verify' and j['conclusion']=='success' for j in jobs)
          print('Candidate build passed; the original full workflow failed its Android wrapper. This run is an independent diagnostic.')
          PY
          git fetch --no-tags --depth=1 origin 0527d778e1456ff607373a4c9ec546500b0153e5
          git diff --exit-code 0527d778e1456ff607373a4c9ec546500b0153e5 HEAD -- android/AndroidManifest.xml android/res web version.json
          gh run download 34162369481 --name lightforge-2.2.1-ci-candidate --dir candidate-input
      - name: Restore pinned models and build the current Android source
        run: |
          set -euo pipefail
          python3 - <<'PYRESTORE'
          import pathlib,hashlib,json,zipfile,os
          src=pathlib.Path('candidate-input/LightForge-2.2.1.apk')
          receipt=json.loads(src.with_suffix('.apk.json').read_text())
          assert src.stat().st_size==receipt['bytes'] and hashlib.file_digest(src.open('rb'),'sha256').hexdigest()==receipt['sha256']
          manifest=json.loads(pathlib.Path('web/analysis/ASSET_MANIFEST.json').read_text())
          with zipfile.ZipFile(src) as archive:
              assert len(archive.namelist())==len(set(archive.namelist()))
              for entry in archive.infolist():
                  if not entry.filename.startswith('assets/') or entry.is_dir():continue
                  rel=pathlib.Path(entry.filename).relative_to('assets')
                  assert '..' not in rel.parts
                  target=pathlib.Path('web')/rel
                  if target.exists():
                      assert hashlib.file_digest(target.open('rb'),'sha256').digest()==hashlib.file_digest(archive.open(entry),'sha256').digest(),str(rel)
                  else:
                      key=str(rel.relative_to('analysis'));expected=manifest[key]
                      target.parent.mkdir(parents=True,exist_ok=True)
                      with archive.open(entry) as stream,target.open('xb') as output:
                          while chunk:=stream.read(1024*1024):
                              assert output.write(chunk)==len(chunk)
                          output.flush();os.fsync(output.fileno())
                      assert target.stat().st_size==expected['bytes'] and hashlib.file_digest(target.open('rb'),'sha256').hexdigest()==expected['sha256']
          src.unlink()
          PYRESTORE
          python3 tools/verify_analysis_assets.py
          export LIGHTFORGE_TOOLCHAIN_DIR="$RUNNER_TEMP/lightforge-toolchain"
          export LIGHTFORGE_SIGNING_DIR="$RUNNER_TEMP/probe-signing"
          python3 tools/bootstrap_toolchain.py
          env -u ANDROID_SDK_ROOT -u ANDROID_HOME LIGHTFORGE_ALLOW_NEW_SIGNING=1 bash build.sh
          env -u ANDROID_SDK_ROOT -u ANDROID_HOME python3 tests/verify_native_release.py --release 2.2.1
          python3 tools/build_android_tests.py
          python3 -m py_compile tools/run_android_background_tests.py
          python3 -m unittest discover -s tests -p test_apk_archive.py
          mkdir -p candidate
          mv dist/LightForge-2.2.1.apk candidate/LightForge-2.2.1.apk
          mv dist/background-tests.apk candidate/background-tests.apk
          python3 - <<'PYRECORD'
          import pathlib,json,os
          record={'scope':'Current production Android source compiled and signed ephemerally; pinned web/model bytes restored from a verified prior CI build, then checked before packaging','test_commit':os.environ['GITHUB_SHA'],'model_candidate_run':34162369481,'build':json.loads(pathlib.Path('dist/LightForge-2.2.1.apk.json').read_text())}
          assert record['build']['signing_certificate_sha256']!='7187d6aa935d5b7d2d656cb87913af95fe1ca3a4b1653036d1d8d890e2016c6b'
          pathlib.Path('qa/release-2.2.1/android-probe-payload-verification.json').write_text(json.dumps(record,indent=2)+'\n')
          PYRECORD
      - name: Prepare Android with bounded resources
        run: |
          printf 'ANDROID_USER_HOME=%s\nANDROID_EMULATOR_HOME=%s\nANDROID_AVD_HOME=%s\n' "$RUNNER_TEMP/lightforge-android" "$RUNNER_TEMP/lightforge-android" "$RUNNER_TEMP/lightforge-android/avd" >> "$GITHUB_ENV"
          sudo rm -rf -- "$ANDROID_HOME/ndk" /usr/share/dotnet
          sudo chmod a+rw /dev/kvm
      - name: Start Android 15 emulator
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-35;google_apis;x86_64" "emulator"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name LightForge --package "system-images;android-35;google_apis;x86_64" --device pixel_6 --path "$ANDROID_AVD_HOME/LightForge.avd"
          test -f "$ANDROID_AVD_HOME/LightForge.ini"
          sed -i 's/^disk.dataPartition.size=.*/disk.dataPartition.size=6G/' "$ANDROID_AVD_HOME/LightForge.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          nohup "$ANDROID_HOME/emulator/emulator" -avd LightForge -no-window -no-audio -no-metrics -partition-size 6144 -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -cores 2 -camera-back none -camera-front none > emulator.log 2>&1 < /dev/null &
      - name: Verify native completion, cancellation and passage resume
        run: python3 tools/run_android_background_tests.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lightforge-2.2.1-native-recovery-probe
          path: |
            qa/release-2.2.1/android-*
            qa/release-2.2.1/probe-*.txt
            emulator.log
          if-no-files-found: error
          retention-days: 30
