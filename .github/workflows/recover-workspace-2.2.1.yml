name: Recover tracked repository source
on:
  push:
    branches: ['diagnostics/2.2.1-recovery']
    paths: ['.github/workflows/recover-workspace-2.2.1.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Split the tracked source archive
        run: |
          set -euo pipefail
          mkdir -p recovery/source1 recovery/source2
          git archive --format=tar.gz HEAD > source.tar.gz
          git rev-parse HEAD > recovery/source1/commit.txt
          python3 - <<'PY'
          import pathlib,hashlib,json
          src=pathlib.Path('source.tar.gz')
          with src.open('rb') as stream:
              for index in (1,2):
                  data=stream.read(400*1024*1024)
                  pathlib.Path(f'recovery/source{index}/source.part').write_bytes(data)
              assert not stream.read(1)
          record={'bytes':src.stat().st_size,'sha256':hashlib.file_digest(src.open('rb'),'sha256').hexdigest()}
          pathlib.Path('recovery/source1/source-manifest.json').write_text(json.dumps(record)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovered-source-1
          path: recovery/source1/
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovered-source-2
          path: recovery/source2/
          compression-level: 0
          retention-days: 7
