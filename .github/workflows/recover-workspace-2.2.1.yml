name: Recover verified build workspace
on:
  push:
    branches: ['diagnostics/2.2.1-recovery']
    paths: ['.github/workflows/recover-workspace-2.2.1.yml']
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: CyberBASSLord-666/LightForge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Archive tracked source and the verified candidate
        run: |
          set -euo pipefail
          mkdir -p recovery/source recovery/parts
          git archive --format=tar.gz HEAD > recovery/source/LightForge-source.tar.gz
          git rev-parse HEAD > recovery/source/commit.txt
          gh run download 34162369481 --name lightforge-2.2.1-ci-candidate --dir candidate
          python3 - <<'PY'
          import hashlib,json,pathlib
          src=pathlib.Path('candidate/LightForge-2.2.1.apk')
          receipt=json.loads(src.with_suffix('.apk.json').read_text())
          assert src.stat().st_size==receipt['bytes']
          assert hashlib.file_digest(src.open('rb'),'sha256').hexdigest()==receipt['sha256']
          manifest={'source_commit':'0527d778e1456ff607373a4c9ec546500b0153e5','candidate':receipt,'parts':[]}
          with src.open('rb') as stream:
              index=0
              while data:=stream.read(400*1024*1024):
                  index+=1
                  p=pathlib.Path(f'recovery/parts/{index}/candidate.part')
                  p.parent.mkdir(parents=True)
                  p.write_bytes(data)
                  manifest['parts'].append({'index':index,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          pathlib.Path('recovery/source/candidate-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          for p in pathlib.Path('recovery/source').iterdir():
              print(p.name,p.stat().st_size,hashlib.file_digest(p.open('rb'),'sha256').hexdigest())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovered-source
          path: recovery/source/
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovered-candidate-1
          path: recovery/parts/1/
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovered-candidate-2
          path: recovery/parts/2/
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovered-candidate-3
          path: recovery/parts/3/
          compression-level: 0
          retention-days: 7
