name: Background controls visual verification
on:
  push:
    branches: ['verification/background-ui']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            web
            qa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node qa/release-2.2.0/background-ui.cjs
      - run: node qa/release-2.2.0/browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: background-controls-2.2
          path: |
            qa/release-2.2.0/background-*.png
            qa/release-2.2.0/background-ui-verification.json
            qa/release-2.2.0/browser-verification.json
            qa/release-2.2.0/*cockpit*.png
          retention-days: 30
