name: Prepare verified APK signing index
on:
  push:
    branches: [main]
    paths:
      - 'releases/v*/prepare.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  index:
    if: github.repository == 'CyberBASSLord-666/LightForge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            tools
            releases
      - name: Index the exact successful CI candidate
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,sys
          sys.path.insert(0,'tools')
          from apk_delta import catalog
          version=json.load(open('version.json'))
          request=json.load(open('releases/v'+version['name']+'/prepare.json'))
          assert type(request['run_id']) is int and request['run_id']>0
          run=json.loads(subprocess.check_output(['gh','api',f"repos/CyberBASSLord-666/LightForge/actions/runs/{request['run_id']}"],text=True))
          assert run['conclusion']=='success' and run['status']=='completed'
          assert run['head_sha']==request['source_commit'] and run['head_repository']['full_name']=='CyberBASSLord-666/LightForge'
          assert run['path']=='.github/workflows/verify-v2.yml'
          out=pathlib.Path('build/candidate');out.mkdir(parents=True)
          subprocess.run(['gh','run','download',str(request['run_id']),'--name','lightforge-2.1-ci-candidate','--dir',str(out)],check=True)
          files=list(out.rglob('LightForge-'+version['name']+'.apk'));assert len(files)==1
          result=catalog(files[0]);result.update(run_id=request['run_id'],source_commit=request['source_commit'])
          pathlib.Path('build/candidate-index.json').write_text(json.dumps(result,separators=(',',':'))+'\n')
          print(json.dumps({k:result[k] for k in ['run_id','source_commit','base_bytes','base_sha256']}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-candidate-index
          path: build/candidate-index.json
          if-no-files-found: error
          retention-days: 30
