name: Performance quality gate

on:
  pull_request:
    paths:
      - 'tools/performance_quality_gate.py'
      - 'tools/analysis_benchmark_contract.py'
      - 'tools/locked_benchmark_runner.py'
      - 'tools/differential_analysis.py'
      - 'qa/performance-gate-policy.json'
      - 'qa/locked-corpus-manifest.template.json'
      - 'tests/performance-quality-gate.test.py'
      - 'tests/performance-quality-gate-workflow.test.py'
      - 'tests/analysis-benchmark-contract.test.py'
      - 'tests/locked-benchmark-runner.test.py'
      - 'tests/differential-analysis.test.py'
      - 'docs/PERFORMANCE_QUALITY_GATE.md'
      - 'docs/ANALYSIS_BENCHMARK_CONTRACT.md'
      - 'docs/LOCKED_BENCHMARK_RUNNER.md'
      - 'docs/DIFFERENTIAL_ANALYSIS.md'
      - '.github/workflows/performance-quality-gate.yml'
  workflow_dispatch:
    inputs:
      baseline_artifact:
        description: Baseline benchmark artifact name
        required: true
      baseline_repository:
        description: Owner/repository containing the baseline artifact source run
        required: true
      baseline_run_id:
        description: GitHub Actions run ID that produced the baseline artifact
        required: true
      candidate_artifact:
        description: Candidate benchmark artifact name
        required: true
      candidate_repository:
        description: Owner/repository containing the candidate artifact source run
        required: true
      candidate_run_id:
        description: GitHub Actions run ID that produced the candidate artifact
        required: true

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 tests/performance-quality-gate.test.py
      - run: python3 tests/performance-quality-gate-workflow.test.py
      - run: python3 tests/analysis-benchmark-contract.test.py
      - run: python3 tests/locked-benchmark-runner.test.py
      - run: python3 tests/differential-analysis.test.py
      - run: >-
          python3 -m py_compile
          tools/performance_quality_gate.py
          tools/analysis_benchmark_contract.py
          tools/locked_benchmark_runner.py
          tools/differential_analysis.py

  compare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: lightforge-release-quality
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require protected default-branch release authority
        env:
          LIGHTFORGE_REF_PROTECTED: ${{ github.ref_protected }}
        run: >-
          test "$GITHUB_REF" = "refs/heads/main" &&
          test "$LIGHTFORGE_REF_PROTECTED" = "true"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.baseline_artifact }}
          path: gate/baseline
          repository: ${{ inputs.baseline_repository }}
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.candidate_artifact }}
          path: gate/candidate
          repository: ${{ inputs.candidate_repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Compare with protected release policy and corpus
        env:
          LIGHTFORGE_RELEASE_POLICY_JSON: ${{ secrets.LIGHTFORGE_RELEASE_POLICY_JSON }}
          LIGHTFORGE_RELEASE_CORPUS_MANIFEST_JSON: ${{ secrets.LIGHTFORGE_RELEASE_CORPUS_MANIFEST_JSON }}
          LIGHTFORGE_RELEASE_POLICY_SHA256: ${{ secrets.LIGHTFORGE_RELEASE_POLICY_SHA256 }}
        run: |
          test -n "$LIGHTFORGE_RELEASE_POLICY_JSON"
          test -n "$LIGHTFORGE_RELEASE_CORPUS_MANIFEST_JSON"
          test -n "$LIGHTFORGE_RELEASE_POLICY_SHA256"
          test -f gate/baseline/benchmark.json
          test -f gate/candidate/benchmark.json
          mkdir -p gate/trusted
          printf '%s' "$LIGHTFORGE_RELEASE_POLICY_JSON" > gate/trusted/performance-gate-policy.json
          printf '%s' "$LIGHTFORGE_RELEASE_CORPUS_MANIFEST_JSON" > gate/trusted/locked-corpus-manifest.json
          python3 -m json.tool gate/trusted/performance-gate-policy.json > /dev/null
          python3 -m json.tool gate/trusted/locked-corpus-manifest.json > /dev/null
          python3 tools/performance_quality_gate.py \
            --baseline gate/baseline/benchmark.json \
            --candidate gate/candidate/benchmark.json \
            --locked-corpus-manifest gate/trusted/locked-corpus-manifest.json \
            --policy gate/trusted/performance-gate-policy.json \
            --trusted-release-policy-sha256 "$LIGHTFORGE_RELEASE_POLICY_SHA256" \
            --output gate/quality-gate-report.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-quality-gate-report
          path: gate/quality-gate-report.json
          if-no-files-found: warn
