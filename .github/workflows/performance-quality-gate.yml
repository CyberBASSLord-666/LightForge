name: Performance quality gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_artifact:
        description: Baseline benchmark artifact name
        required: false
      baseline_run_id:
        description: Successful approved LightForge Actions run ID that produced the baseline artifact
        required: false
      candidate_artifact:
        description: Candidate benchmark artifact name
        required: false
      candidate_run_id:
        description: Successful approved LightForge Actions run ID that produced the candidate artifact
        required: false
      release_candidate_run_id:
        description: Successful verify-v2 run ID that produced the exact candidate APK to publish
        required: false
      release_version:
        description: Candidate LightForge release version, for example 2.2.5
        required: false
      benchmark_diagnostics_artifact:
        description: Exact diagnostic-report artifact to aggregate with the locked runner
        required: false
      benchmark_diagnostics_run_id:
        description: Actions run ID containing the exact diagnostic-report artifact
        required: false
      benchmark_artifact:
        description: Exact output artifact name for the locked benchmark aggregate
        required: false
      benchmark_protocol_id:
        description: Locked benchmark protocol identifier
        required: false
      benchmark_cache_mode:
        description: Controlled benchmark cache mode (cold, warm, or resumed)
        required: false
      benchmark_cache_setup_id:
        description: Opaque ID for the controlled cache reset/warm/resume procedure
        required: false
      benchmark_pair_order:
        description: Pair ordering (baseline-first, candidate-first, or counterbalanced)
        required: false
      benchmark_thermal_cycle_id:
        description: Opaque ID for the controlled thermal cycle
        required: false
      benchmark_report_side:
        description: Locked benchmark side (baseline or candidate)
        required: false
      benchmark_change_classification:
        description: Candidate change classification for the attested review (minor or major)
        required: false
      benchmark_change_id:
        description: Opaque candidate change identifier for the attested review
        required: false

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reject incomplete manual gate requests
        if: github.event_name == 'workflow_dispatch'
        env:
          BASELINE_ARTIFACT: ${{ inputs.baseline_artifact }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_CANDIDATE_RUN_ID: ${{ inputs.release_candidate_run_id }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          DIAGNOSTIC_ARTIFACT: ${{ inputs.benchmark_diagnostics_artifact }}
          DIAGNOSTIC_RUN_ID: ${{ inputs.benchmark_diagnostics_run_id }}
          BENCHMARK_ARTIFACT: ${{ inputs.benchmark_artifact }}
          BENCHMARK_PROTOCOL_ID: ${{ inputs.benchmark_protocol_id }}
          BENCHMARK_CACHE_MODE: ${{ inputs.benchmark_cache_mode }}
          BENCHMARK_CACHE_SETUP_ID: ${{ inputs.benchmark_cache_setup_id }}
          BENCHMARK_PAIR_ORDER: ${{ inputs.benchmark_pair_order }}
          BENCHMARK_THERMAL_CYCLE_ID: ${{ inputs.benchmark_thermal_cycle_id }}
          BENCHMARK_REPORT_SIDE: ${{ inputs.benchmark_report_side }}
        run: |
          python3 - <<'PY'
          import os
          aggregate = (
              "DIAGNOSTIC_ARTIFACT", "DIAGNOSTIC_RUN_ID", "BENCHMARK_ARTIFACT",
              "BENCHMARK_PROTOCOL_ID", "BENCHMARK_CACHE_MODE", "BENCHMARK_CACHE_SETUP_ID",
              "BENCHMARK_PAIR_ORDER", "BENCHMARK_THERMAL_CYCLE_ID", "BENCHMARK_REPORT_SIDE",
          )
          compare = (
              "BASELINE_ARTIFACT", "BASELINE_RUN_ID", "CANDIDATE_ARTIFACT",
              "CANDIDATE_RUN_ID", "RELEASE_CANDIDATE_RUN_ID", "RELEASE_VERSION",
          )
          groups = [(name, [os.environ.get(key, "") for key in fields]) for name, fields in (
              ("benchmark aggregation", aggregate), ("release comparison", compare)
          )]
          complete = []
          for name, values in groups:
              supplied = [bool(value) for value in values]
              if any(supplied) and not all(supplied):
                  raise SystemExit(f"incomplete manual {name} request")
              complete.append(all(supplied))
          if sum(complete) != 1:
              raise SystemExit("manual dispatch must request exactly one complete operation")
          PY
      - run: python3 tests/performance-quality-gate.test.py
      - run: python3 tests/performance-quality-gate-workflow.test.py
      - run: python3 tests/test_release_quality_gate.py
      - run: python3 tests/test_release_quality_publication_wiring.py
      - run: python3 tests/test_release_policy_setup.py
      - run: python3 tests/analysis-benchmark-contract.test.py
      - run: python3 tests/locked-benchmark-runner.test.py
      - run: python3 tests/differential-analysis.test.py
      - run: >-
          python3 -m py_compile
          tools/performance_quality_gate.py
          tools/release_policy_setup.py
          tools/analysis_benchmark_contract.py
          tools/locked_benchmark_runner.py
          tools/differential_analysis.py
          tools/release_quality_gate.py
          tools/publish_github_release.py

  benchmark:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.benchmark_diagnostics_artifact != '' ||
       inputs.benchmark_diagnostics_run_id != '' ||
       inputs.benchmark_artifact != '' ||
       inputs.benchmark_protocol_id != '' ||
       inputs.benchmark_cache_mode != '' ||
       inputs.benchmark_cache_setup_id != '' ||
       inputs.benchmark_pair_order != '' ||
       inputs.benchmark_thermal_cycle_id != '' ||
       inputs.benchmark_report_side != '' ||
       inputs.benchmark_change_classification != '' ||
       inputs.benchmark_change_id != '')
    needs: unit
    runs-on: ubuntu-latest
    environment: lightforge-release-quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require protected default-branch benchmark authority
        env:
          LIGHTFORGE_REF_PROTECTED: ${{ github.ref_protected }}
          DIAGNOSTIC_ARTIFACT: ${{ inputs.benchmark_diagnostics_artifact }}
          DIAGNOSTIC_RUN_ID: ${{ inputs.benchmark_diagnostics_run_id }}
          BENCHMARK_ARTIFACT: ${{ inputs.benchmark_artifact }}
          BENCHMARK_PROTOCOL_ID: ${{ inputs.benchmark_protocol_id }}
          BENCHMARK_CACHE_MODE: ${{ inputs.benchmark_cache_mode }}
          BENCHMARK_CACHE_SETUP_ID: ${{ inputs.benchmark_cache_setup_id }}
          BENCHMARK_PAIR_ORDER: ${{ inputs.benchmark_pair_order }}
          BENCHMARK_THERMAL_CYCLE_ID: ${{ inputs.benchmark_thermal_cycle_id }}
          BENCHMARK_REPORT_SIDE: ${{ inputs.benchmark_report_side }}
          BENCHMARK_CHANGE_CLASSIFICATION: ${{ inputs.benchmark_change_classification }}
          BENCHMARK_CHANGE_ID: ${{ inputs.benchmark_change_id }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$LIGHTFORGE_REF_PROTECTED" = "true"
          test -n "$DIAGNOSTIC_ARTIFACT"
          test -n "$DIAGNOSTIC_RUN_ID"
          test -n "$BENCHMARK_ARTIFACT"
          test -n "$BENCHMARK_PROTOCOL_ID"
          test -n "$BENCHMARK_CACHE_MODE"
          test -n "$BENCHMARK_CACHE_SETUP_ID"
          test -n "$BENCHMARK_PAIR_ORDER"
          test -n "$BENCHMARK_THERMAL_CYCLE_ID"
          test "$BENCHMARK_PAIR_ORDER" = baseline-first || test "$BENCHMARK_PAIR_ORDER" = candidate-first || test "$BENCHMARK_PAIR_ORDER" = counterbalanced
          test "$BENCHMARK_REPORT_SIDE" = baseline || test "$BENCHMARK_REPORT_SIDE" = candidate
          if test "$BENCHMARK_REPORT_SIDE" = baseline; then
            test -z "$BENCHMARK_CHANGE_CLASSIFICATION"
            test -z "$BENCHMARK_CHANGE_ID"
          else
            test -n "$BENCHMARK_CHANGE_CLASSIFICATION"
            test -n "$BENCHMARK_CHANGE_ID"
          fi
          python3 - "$BENCHMARK_ARTIFACT" <<'PY'
          import re
          import sys
          if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", sys.argv[1]) is None:
              raise SystemExit("benchmark artifact name is invalid")
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.benchmark_diagnostics_artifact }}
          path: gate/diagnostics
          repository: ${{ github.repository }}
          run-id: ${{ inputs.benchmark_diagnostics_run_id }}
          github-token: ${{ github.token }}
      - name: Aggregate diagnostics with the protected locked runner
        env:
          LIGHTFORGE_RELEASE_POLICY_JSON: ${{ secrets.LIGHTFORGE_RELEASE_POLICY_JSON }}
          LIGHTFORGE_RELEASE_CORPUS_MANIFEST_JSON: ${{ secrets.LIGHTFORGE_RELEASE_CORPUS_MANIFEST_JSON }}
          BENCHMARK_PROTOCOL_ID: ${{ inputs.benchmark_protocol_id }}
          BENCHMARK_CACHE_MODE: ${{ inputs.benchmark_cache_mode }}
          BENCHMARK_CACHE_SETUP_ID: ${{ inputs.benchmark_cache_setup_id }}
          BENCHMARK_PAIR_ORDER: ${{ inputs.benchmark_pair_order }}
          BENCHMARK_THERMAL_CYCLE_ID: ${{ inputs.benchmark_thermal_cycle_id }}
          BENCHMARK_REPORT_SIDE: ${{ inputs.benchmark_report_side }}
          BENCHMARK_CHANGE_CLASSIFICATION: ${{ inputs.benchmark_change_classification }}
          BENCHMARK_CHANGE_ID: ${{ inputs.benchmark_change_id }}
        run: |
          test -n "$LIGHTFORGE_RELEASE_POLICY_JSON"
          test -n "$LIGHTFORGE_RELEASE_CORPUS_MANIFEST_JSON"
          mkdir -p gate/trusted gate/benchmark
          printf '%s' "$LIGHTFORGE_RELEASE_POLICY_JSON" > gate/trusted/performance-gate-policy.json
          printf '%s' "$LIGHTFORGE_RELEASE_CORPUS_MANIFEST_JSON" > gate/trusted/locked-corpus-manifest.json
          python3 -m json.tool gate/trusted/performance-gate-policy.json > /dev/null
          python3 -m json.tool gate/trusted/locked-corpus-manifest.json > /dev/null
          test -d gate/diagnostics/reports
          if test "$BENCHMARK_REPORT_SIDE" = candidate; then
            test -f gate/diagnostics/human-perceptual-review.json
          fi
          arguments=(
            --manifest gate/trusted/locked-corpus-manifest.json
            --reports gate/diagnostics/reports
            --policy gate/trusted/performance-gate-policy.json
            --protocol-id "$BENCHMARK_PROTOCOL_ID"
            --cache-mode "$BENCHMARK_CACHE_MODE"
            --cache-setup-id "$BENCHMARK_CACHE_SETUP_ID"
            --pair-order "$BENCHMARK_PAIR_ORDER"
            --thermal-cycle-id "$BENCHMARK_THERMAL_CYCLE_ID"
            --report-side "$BENCHMARK_REPORT_SIDE"
            --output gate/benchmark/benchmark.json
          )
          if test "$BENCHMARK_REPORT_SIDE" = candidate; then
            arguments+=(
              --change-classification "$BENCHMARK_CHANGE_CLASSIFICATION"
              --change-id "$BENCHMARK_CHANGE_ID"
              --human-perceptual-review gate/diagnostics/human-perceptual-review.json
            )
            if test -f gate/diagnostics/candidate-output-differential.json; then
              arguments+=(
                --candidate-output-differential gate/diagnostics/candidate-output-differential.json
              )
            fi
          fi
          python3 tools/locked_benchmark_runner.py aggregate "${arguments[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.benchmark_artifact }}
          path: gate/benchmark/benchmark.json
          if-no-files-found: error

  compare:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.baseline_artifact != '' &&
      inputs.baseline_run_id != '' &&
      inputs.candidate_artifact != '' &&
      inputs.candidate_run_id != '' &&
      inputs.release_candidate_run_id != '' &&
      inputs.release_version != ''
    needs: unit
    runs-on: ubuntu-latest
    environment: lightforge-release-quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require protected default-branch release authority
        env:
          LIGHTFORGE_REF_PROTECTED: ${{ github.ref_protected }}
        run: >-
          test "$GITHUB_REF" = "refs/heads/main" &&
          test "$LIGHTFORGE_REF_PROTECTED" = "true"
      - name: Resolve the exact baseline benchmark artifact
        id: baseline-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.baseline_run_id }}
          ARTIFACT_NAME: ${{ inputs.baseline_artifact }}
        run: |
          set -euo pipefail
          mkdir -p gate
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[]' > gate/baseline-artifacts.ndjson
          artifact_id="$(python3 - "$ARTIFACT_NAME" gate/baseline-artifacts.ndjson "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          expected, inventory, output = sys.argv[1:]
          records = [json.loads(line) for line in open(inventory, encoding="utf-8") if line.strip()]
          matches = [record for record in records if record.get("name") == expected]
          if len(matches) != 1 or type(matches[0].get("id")) is not int or matches[0]["id"] <= 0:
              raise SystemExit("expected exactly one baseline benchmark artifact")
          with open(output, "a", encoding="utf-8") as stream:
              print("id=" + str(matches[0]["id"]), file=stream)
          print(matches[0]["id"])
          PY
          )"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > gate/baseline-artifact.json
      - name: Resolve the exact candidate benchmark artifact
        id: candidate-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          ARTIFACT_NAME: ${{ inputs.candidate_artifact }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[]' > gate/candidate-artifacts.ndjson
          artifact_id="$(python3 - "$ARTIFACT_NAME" gate/candidate-artifacts.ndjson "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          expected, inventory, output = sys.argv[1:]
          records = [json.loads(line) for line in open(inventory, encoding="utf-8") if line.strip()]
          matches = [record for record in records if record.get("name") == expected]
          if len(matches) != 1 or type(matches[0].get("id")) is not int or matches[0]["id"] <= 0:
              raise SystemExit("expected exactly one candidate benchmark artifact")
          with open(output, "a", encoding="utf-8") as stream:
              print("id=" + str(matches[0]["id"]), file=stream)
          print(matches[0]["id"])
          PY
          )"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > gate/candidate-artifact.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.baseline-artifact.outputs.id }}
          path: gate/baseline
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.candidate-artifact.outputs.id }}
          path: gate/candidate
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Compare with protected release policy and corpus
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTFORGE_RELEASE_POLICY_JSON: ${{ secrets.LIGHTFORGE_RELEASE_POLICY_JSON }}
          LIGHTFORGE_RELEASE_CORPUS_MANIFEST_JSON: ${{ secrets.LIGHTFORGE_RELEASE_CORPUS_MANIFEST_JSON }}
          LIGHTFORGE_RELEASE_POLICY_ATTESTATION_JSON: ${{ secrets.LIGHTFORGE_RELEASE_POLICY_ATTESTATION_JSON }}
        run: |
          test -n "$LIGHTFORGE_RELEASE_POLICY_JSON"
          test -n "$LIGHTFORGE_RELEASE_CORPUS_MANIFEST_JSON"
          test -n "$LIGHTFORGE_RELEASE_POLICY_ATTESTATION_JSON"
          test -f gate/baseline/benchmark.json
          test -f gate/candidate/benchmark.json
          mkdir -p gate/trusted
          printf '%s' "$LIGHTFORGE_RELEASE_POLICY_JSON" > gate/trusted/performance-gate-policy.json
          printf '%s' "$LIGHTFORGE_RELEASE_CORPUS_MANIFEST_JSON" > gate/trusted/locked-corpus-manifest.json
          printf '%s' "$LIGHTFORGE_RELEASE_POLICY_ATTESTATION_JSON" > gate/trusted/release-policy-attestation.json
          python3 -m json.tool gate/trusted/performance-gate-policy.json > /dev/null
          python3 -m json.tool gate/trusted/locked-corpus-manifest.json > /dev/null
          python3 -m json.tool gate/trusted/release-policy-attestation.json > /dev/null
          python3 tools/performance_quality_gate.py \
            --baseline gate/baseline/benchmark.json \
            --candidate gate/candidate/benchmark.json \
            --locked-corpus-manifest gate/trusted/locked-corpus-manifest.json \
            --policy gate/trusted/performance-gate-policy.json \
           --release-policy-attestation gate/trusted/release-policy-attestation.json \
            --output gate/quality-gate-report.json \
            --require-production-ready
      - name: Bind production-ready report to candidate commit, tree, release and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTFORGE_REF_PROTECTED: ${{ github.ref_protected }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          BASELINE_ARTIFACT: ${{ inputs.baseline_artifact }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          RELEASE_CANDIDATE_RUN_ID: ${{ inputs.release_candidate_run_id }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$LIGHTFORGE_REF_PROTECTED" = "true"
          test "$RELEASE_VERSION" = "$(python3 -c 'import json; print(json.load(open("version.json"))["name"])')"
          test -f "releases/v$RELEASE_VERSION/quality-gate-declaration.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN_ID" > gate/baseline-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > gate/candidate-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_CANDIDATE_RUN_ID" > gate/release-candidate-run.json
          baseline_commit="$(python3 -c 'import json; print(json.load(open("gate/baseline-run.json"))["head_sha"])')"
          candidate_commit="$(python3 -c 'import json; print(json.load(open("gate/candidate-run.json"))["head_sha"])')"
          release_candidate_commit="$(python3 -c 'import json; print(json.load(open("gate/release-candidate-run.json"))["head_sha"])')"
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$baseline_commit" > gate/baseline-commit.json
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$candidate_commit" > gate/candidate-commit.json
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$release_candidate_commit" > gate/release-candidate-commit.json
          python3 tools/release_quality_gate.py create-provenance \
            --report gate/quality-gate-report.json \
            --version-json version.json \
            --release-declaration-json "releases/v$RELEASE_VERSION/quality-gate-declaration.json" \
            --source-commit "$GITHUB_SHA" \
            --source-tree-sha "$(git rev-parse "$GITHUB_SHA^{tree}")" \
            --ref "$GITHUB_REF" \
            --ref-protected "$LIGHTFORGE_REF_PROTECTED" \
            --quality-run-id "$GITHUB_RUN_ID" \
            --baseline-run-json gate/baseline-run.json \
            --baseline-commit-json gate/baseline-commit.json \
            --baseline-artifact "$BASELINE_ARTIFACT" \
            --baseline-artifact-json gate/baseline-artifact.json \
            --baseline-benchmark gate/baseline/benchmark.json \
            --candidate-run-json gate/candidate-run.json \
            --candidate-commit-json gate/candidate-commit.json \
            --candidate-artifact "$CANDIDATE_ARTIFACT" \
            --candidate-artifact-json gate/candidate-artifact.json \
            --candidate-benchmark gate/candidate/benchmark.json \
            --release-candidate-run-json gate/release-candidate-run.json \
            --release-candidate-commit-json gate/release-candidate-commit.json \
            --release-candidate-artifact "lightforge-$RELEASE_VERSION-ci-candidate" \
            --output gate/quality-gate-provenance.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-quality-gate-report
          path: |
            gate/quality-gate-report.json
            gate/quality-gate-provenance.json
          if-no-files-found: warn
