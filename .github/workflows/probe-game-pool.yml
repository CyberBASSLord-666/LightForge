name: Android exact GAME pool qualification
on:
  push:
    branches: ['diagnostics/game-pool']
permissions:
  contents: read
  actions: read
concurrency:
  group: lightforge-game-pool-diagnostic
  cancel-in-progress: true
jobs:
  game-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            .github
            android
            web
            tools
            tests
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned compile and signing tools
        run: python3 tools/bootstrap_toolchain.py
      - name: Rebuild current app code with exact pinned CI model and runtime payloads
        run: python3 tools/prepare_game_pool_probe.py
      - name: Configure Android virtual-device paths
        run: |
          printf 'ANDROID_USER_HOME=%s\nANDROID_EMULATOR_HOME=%s\nANDROID_AVD_HOME=%s\n' "$RUNNER_TEMP/lightforge-android" "$RUNNER_TEMP/lightforge-android" "$RUNNER_TEMP/lightforge-android/avd" >> "$GITHUB_ENV"
      - name: Reclaim unused toolchains on the disposable runner
        run: sudo rm -rf -- "$ANDROID_HOME/ndk" /usr/share/dotnet
      - name: Record real host RAM and CPU capacity before starting the eight-GiB guest
        run: python3 tools/prepare_game_pool_probe.py --host-preflight
      - name: Start API 35 emulator with eight GiB RAM and four virtual CPU cores
        run: |
          sudo chmod a+rw /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-35;google_apis;x86_64" "emulator"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name LightForgeGamePool --package "system-images;android-35;google_apis;x86_64" --device pixel_6 --path "$ANDROID_AVD_HOME/LightForgeGamePool.avd"
          sed -i 's/^disk.dataPartition.size=.*/disk.dataPartition.size=6G/' "$ANDROID_AVD_HOME/LightForgeGamePool.avd/config.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd LightForgeGamePool -no-window -no-audio -no-metrics -partition-size 6144 -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 8192 -cores 4 -camera-back none -camera-front none > emulator.log 2>&1 < /dev/null &
          printf '%s\n' "$!" > emulator.pid
      - name: Compare real serial and parallel GAME outputs and observe resource lifecycle
        run: python3 tools/prepare_game_pool_probe.py --run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lightforge-game-pool-${{ github.run_id }}
          path: |
            diagnostic-input/game-pool
            emulator.log
          if-no-files-found: error
          retention-days: 30
