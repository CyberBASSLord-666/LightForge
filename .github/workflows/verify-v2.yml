name: LightForge production verification
on:
  push:
    branches: [main, 'development/2.0', 'development/2.1', 'development/2.2', 'development/2.2.1']
    paths-ignore:
      - '**/*.md'
      - 'qa/**/*-verification.json'
      - 'qa/**/*.png'
      - 'qa/**/*.txt'
      - 'qa/**/*.log'
      - 'release-verification.json'
      - 'releases/v*/prepare.json'
      - 'releases/v*/request.json'
      - 'releases/v*/signed-apk.delta.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-v2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      candidate_artifact_digest: ${{ steps.upload_candidate.outputs.artifact-digest }}
      candidate_identity_sha256: ${{ steps.candidate_manifest.outputs.identity_sha256 }}
      candidate_run_id: ${{ github.run_id }}
      candidate_run_attempt: ${{ github.run_attempt }}
      candidate_evidence_session: ${{ steps.candidate_session.outputs.session }}
      verification_evidence_artifact_id: ${{ steps.upload_verification_evidence.outputs.artifact-id }}
      verification_evidence_artifact_digest: ${{ steps.upload_verification_evidence.outputs.artifact-digest }}
      verification_evidence_wrapper_artifact_id: ${{ steps.upload_verification_evidence_wrapper.outputs.artifact-id }}
      verification_evidence_wrapper_artifact_digest: ${{ steps.upload_verification_evidence_wrapper.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            .github
            android
            web
            tools
            tests
            qa
            research/model-source
            research/evaluation-1.6
            research/upstream/deux
      - name: Read current release version
        run: |
          python3 - <<'PYVERSION'
          import json,os
          version=json.load(open('version.json'))['name']
          assert len(version.split('.'))==3 and all(p.isdigit() for p in version.split('.'))
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('LIGHTFORGE_RELEASE='+version+'\n')
          PYVERSION
      - name: Create per-run candidate evidence session
        id: candidate_session
        run: |
          python3 - <<'PYSESSION'
          import os, secrets
          session = secrets.token_hex(32)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write('LIGHTFORGE_EVIDENCE_SESSION=' + session + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('session=' + session + '\n')
          PYSESSION
      - name: Remove checked-in core receipts before fresh verification
        run: |
          receipt_root="qa/release-$LIGHTFORGE_RELEASE"
          # Every CI-produced current-release receipt starts absent.  This
          # makes a killed producer visibly missing rather than allowing a
          # checked-in or prior-run pass to be sealed.
          rm -f -- \
            "$receipt_root/regression-verification.json" \
            "$receipt_root/browser-verification.json" \
            "$receipt_root/background-ui-verification.json" \
            "$receipt_root/restore-preview-verification.json" \
            "$receipt_root/analysis-browser-verification.json" \
            "$receipt_root/native-inference-profile-equivalence.json" \
            "$receipt_root/native-mdx-comparison-verification.json" \
            "$receipt_root/native-mdx-downstream-verification.json" \
            "$receipt_root/native-mdx-downstream-native.json" \
            "$receipt_root/native-mdx-downstream-wasm.json" \
            "$receipt_root/native-recovery-results.json" \
            "$receipt_root/native-verification.json" \
            "$receipt_root/analysis-verification.json" \
            "$receipt_root/composer-verification.json" \
            "$receipt_root/light-verification.json" \
            "$receipt_root/movement-verification.json" \
            "$receipt_root/role-composer-verification.json" \
            "$receipt_root/role-reference-composer-verification.json" \
            "$receipt_root/source-clock-verification.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce bundled production models
        run: |
          python3 -m pip install --no-cache-dir torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --no-cache-dir -r tools/model-requirements.txt
          python3 tools/prepare_game.py
          python3 tools/prepare_deux.py
      - name: Production regression, diagnostics, and quality-tool suites
        run: npm test
      - name: Source-clock seams and complete final samples
        run: node qa/release-${{ env.LIGHTFORGE_RELEASE }}/test-source-clock.cjs
      - name: Prepare licensed reference excerpts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p qa/release-1.6.0/fixtures
          curl -fL --retry 3 https://github.com/sigsep/sigsep-mus-db/releases/download/v0.4.0/MUSDB18-7-STEMS.zip -o qa/release-1.6.0/fixtures/MUSDB18-7-STEMS.zip
          echo '365f66acffc57282e474a4c24b32afec3678258c50b8d45646ac849b0a287df3  qa/release-1.6.0/fixtures/MUSDB18-7-STEMS.zip' | sha256sum -c
          python3 qa/release-1.6.0/prepare-musdb-fixtures.py
      - run: npx playwright install --with-deps chromium
      - run: node qa/release-${{ env.LIGHTFORGE_RELEASE }}/browser.cjs
      - run: node qa/release-${{ env.LIGHTFORGE_RELEASE }}/background-ui.cjs
      - name: Foreground-resume restore preview proof
        run: |
          LIGHTFORGE_RESTORE_QA_OUTPUT="qa/release-$LIGHTFORGE_RELEASE" \
            node qa/restore-preview/browser.cjs
      - name: Actual offline model pipeline and cancellation
        run: node qa/release-${{ env.LIGHTFORGE_RELEASE }}/analysis-browser.cjs
      - name: Bootstrap pinned native host toolchain
        run: python3 tools/bootstrap_toolchain.py
      - name: Regenerate and verify same-session native evidence
        run: |
          test -n "$LIGHTFORGE_EVIDENCE_SESSION"
          python3 tools/bootstrap_testdeps.py
          python3 qa/release-${{ env.LIGHTFORGE_RELEASE }}/compare-native-mdx.py
          node qa/release-${{ env.LIGHTFORGE_RELEASE }}/verify-mdx-downstream.cjs
          python3 qa/release-${{ env.LIGHTFORGE_RELEASE }}/verify-native-inference-profile.py
          python3 qa/release-${{ env.LIGHTFORGE_RELEASE }}/verify-analysis.py
      - name: Verify native Balanced startup, cancellation and crash-lease lifecycle
        run: python3 tests/test_native_mdx_lifecycle.py
      - name: Build CI package with an ephemeral signing identity
        run: |
          set -o pipefail
          df -h .
          env -u ANDROID_SDK_ROOT -u ANDROID_HOME LIGHTFORGE_ALLOW_NEW_SIGNING=1 LIGHTFORGE_SIGNING_DIR="$RUNNER_TEMP/ci-signing" bash build.sh 2>&1 | tee qa/release-${{ env.LIGHTFORGE_RELEASE }}/ci-build.log
          df -h .
      - name: Native storage and sequence validation
        run: env -u ANDROID_SDK_ROOT -u ANDROID_HOME python3 tests/verify_native_release.py --release ${{ env.LIGHTFORGE_RELEASE }}
      - name: Build same-signed Android lifecycle instrumentation
        run: LIGHTFORGE_SIGNING_DIR="$RUNNER_TEMP/ci-signing" python3 tools/build_android_tests.py
      - name: Build same-signed diagnostic export instrumentation
        run: LIGHTFORGE_SIGNING_DIR="$RUNNER_TEMP/ci-signing" python3 tools/build_diagnostics_tests.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lightforge-${{ env.LIGHTFORGE_RELEASE }}-verification
          path: |
            qa/release-${{ env.LIGHTFORGE_RELEASE }}/*.json
            !qa/release-${{ env.LIGHTFORGE_RELEASE }}/android-*
            qa/release-${{ env.LIGHTFORGE_RELEASE }}/*.log
            qa/release-${{ env.LIGHTFORGE_RELEASE }}/*.txt
            qa/release-${{ env.LIGHTFORGE_RELEASE }}/*.png
          retention-days: 30
      - name: Seal exact same-signed candidate
        id: candidate_manifest
        run: |
          candidate_root="$RUNNER_TEMP/lightforge-ci-candidate"
          source_hashes="$RUNNER_TEMP/lightforge-ci-source-hashes.json"
          git diff --exit-code "$GITHUB_SHA" -- \
            android web tools tests "qa/release-$LIGHTFORGE_RELEASE" qa/restore-preview/browser.cjs \
            .github/workflows/verify-v2.yml version.json package.json package-lock.json build.sh
          python3 - "$source_hashes" <<'PYSOURCES'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          root = Path('.').resolve()
          names = subprocess.check_output([
              'git', 'ls-files', '-z', '--', 'android', 'web', 'tools', 'tests',
              'qa/release-' + os.environ['LIGHTFORGE_RELEASE'], 'qa/restore-preview/browser.cjs',
              '.github/workflows/verify-v2.yml', 'version.json', 'package.json', 'package-lock.json',
              'build.sh',
          ]).split(b'\0')
          hashes = {}
          for raw in names:
              if not raw:
                  continue
              relative = raw.decode('utf-8')
              path = root / relative
              if not path.is_file():
                  raise SystemExit('Tracked source is unavailable in sparse checkout: ' + relative)
              hashes[relative] = hashlib.sha256(path.read_bytes()).hexdigest()
          if not hashes:
              raise SystemExit('Candidate source hash inventory is empty')
          Path(sys.argv[1]).write_text(json.dumps(hashes, sort_keys=True) + '\n', encoding='utf-8')
          PYSOURCES
          python3 tools/android_evidence_manifest.py create-candidate \
            --input-dir dist --output-dir "$candidate_root" \
            --release "$LIGHTFORGE_RELEASE" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --head-sha "$GITHUB_SHA" \
            --tree-sha "$(git rev-parse "$GITHUB_SHA^{tree}")" \
            --evidence-session "$LIGHTFORGE_EVIDENCE_SESSION" --source-hashes "$source_hashes"
          echo "identity_sha256=$(sha256sum "$candidate_root/candidate-manifest.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Retain sealed candidate for local release signing
        id: upload_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lightforge-${{ env.LIGHTFORGE_RELEASE }}-ci-candidate
          path: ${{ runner.temp }}/lightforge-ci-candidate
          compression-level: 0
          # The candidate name is intentionally stable for legacy quality-gate
          # consumers, while its immutable output ID is what downstream jobs
          # and the publisher bind.  This makes an explicit rerun-all replace
          # the prior same-run candidate rather than failing open or reusing it.
          overwrite: true
          retention-days: 30
          if-no-files-found: error
      - name: Seal success-only non-Android verification evidence
        run: |
          evidence_root="$RUNNER_TEMP/lightforge-verification-evidence"
          python3 tools/verification_evidence_manifest.py write-content \
            --output-dir "$evidence_root" \
            --receipt-dir "qa/release-$LIGHTFORGE_RELEASE" \
            --source-root "$GITHUB_WORKSPACE" \
            --candidate-manifest "$RUNNER_TEMP/lightforge-ci-candidate/candidate-manifest.json" \
            --candidate-artifact-id "${{ steps.upload_candidate.outputs.artifact-id }}" \
            --candidate-artifact-digest "${{ steps.upload_candidate.outputs.artifact-digest }}" \
            --candidate-identity-sha256 "${{ steps.candidate_manifest.outputs.identity_sha256 }}" \
            --release "$LIGHTFORGE_RELEASE" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --head-sha "$GITHUB_SHA" \
            --tree-sha "$(git rev-parse "$GITHUB_SHA^{tree}")" \
            --evidence-session "$LIGHTFORGE_EVIDENCE_SESSION"
      - name: Retain sealed non-Android verification evidence
        id: upload_verification_evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lightforge-${{ env.LIGHTFORGE_RELEASE }}-verification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lightforge-verification-evidence
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Seal immutable non-Android evidence manifest
        run: |
          python3 tools/verification_evidence_manifest.py write-wrapper \
            --output-dir "$RUNNER_TEMP/lightforge-verification-evidence-wrapper" \
            --content-dir "$RUNNER_TEMP/lightforge-verification-evidence" \
            --evidence-artifact-id "${{ steps.upload_verification_evidence.outputs.artifact-id }}" \
            --evidence-artifact-digest "${{ steps.upload_verification_evidence.outputs.artifact-digest }}" \
            --release "$LIGHTFORGE_RELEASE" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --head-sha "$GITHUB_SHA" \
            --tree-sha "$(git rev-parse "$GITHUB_SHA^{tree}")" \
            --evidence-session "$LIGHTFORGE_EVIDENCE_SESSION"
      - name: Retain immutable non-Android evidence manifest
        id: upload_verification_evidence_wrapper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lightforge-${{ env.LIGHTFORGE_RELEASE }}-verification-evidence-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lightforge-verification-evidence-wrapper
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  android-background:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      android_evidence_artifact_id: ${{ steps.upload_android_evidence.outputs.artifact-id }}
      android_evidence_artifact_digest: ${{ steps.upload_android_evidence.outputs.artifact-digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            android
            web
            tools
            tests
            qa
      - name: Read current release version
        run: |
          python3 - <<'PYVERSION'
          import json,os
          version=json.load(open('version.json'))['name']
          assert len(version.split('.'))==3 and all(p.isdigit() for p in version.split('.'))
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('LIGHTFORGE_RELEASE='+version+'\n')
          PYVERSION
      - name: Create current Android evidence session
        id: android_session
        run: |
          python3 - <<'PYSESSION'
          import os, secrets
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('session=' + secrets.token_hex(32) + '\n')
          PYSESSION
      - name: Download the exact same-signed CI app and instrumentation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/lightforge-ci-candidate
          merge-multiple: true
      - name: Assert exact flat sealed candidate handoff
        run: |
          python3 - "$RUNNER_TEMP/lightforge-ci-candidate" "$LIGHTFORGE_RELEASE" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          release = sys.argv[2]
          expected = {
              'candidate-manifest.json',
              'LightForge-' + release + '.apk',
              'LightForge-' + release + '.apk.json',
              'LightForge-' + release + '.apk.sha256',
              'background-tests.apk',
              'diagnostics-tests.apk',
          }
          if not root.is_dir() or root.is_symlink():
              raise SystemExit('Candidate artifact extraction is not a flat exact inventory')
          entries = list(root.iterdir())
          if {entry.name for entry in entries} != expected or any(not entry.is_file() or entry.is_symlink() for entry in entries):
              raise SystemExit('Candidate artifact extraction is not a flat exact inventory')
          PY
      - name: Configure Android virtual-device paths
        run: |
          printf 'ANDROID_USER_HOME=%s\nANDROID_EMULATOR_HOME=%s\nANDROID_AVD_HOME=%s\nLIGHTFORGE_ANDROID_EVIDENCE_ROOT=%s\n' \
            "$RUNNER_TEMP/lightforge-android" "$RUNNER_TEMP/lightforge-android" "$RUNNER_TEMP/lightforge-android/avd" \
            "$RUNNER_TEMP/lightforge-android-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Reclaim unused preinstalled toolchains on the disposable runner
        run: |
          # This Java/WebView app needs neither the NDK nor the .NET SDK.
          sudo rm -rf -- "$ANDROID_HOME/ndk" /usr/share/dotnet
          df -h .
      - name: Prepare Android 15 emulator
        run: |
          sudo chmod a+rw /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-35;google_apis;x86_64" "emulator"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name LightForge --package "system-images;android-35;google_apis;x86_64" --device pixel_6 --path "$ANDROID_AVD_HOME/LightForge.avd"
          test -f "$ANDROID_AVD_HOME/LightForge.ini"
          sed -i 's/^disk.dataPartition.size=.*/disk.dataPartition.size=6G/' "$ANDROID_AVD_HOME/LightForge.avd/config.ini"
          df -h "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          # This runner exposes two KVM CPUs. Oversubscribing virtual CPUs
          # competes with SwiftShader and can stall real WebView frame commits.
          nohup "$ANDROID_HOME/emulator/emulator" -avd LightForge -no-window -no-audio -no-metrics -partition-size 6144 -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -cores 2 -camera-back none -camera-front none > "$RUNNER_TEMP/lightforge-android-emulator.log" 2>&1 < /dev/null &
      - name: Verify screen-off analysis and Activity-independent completion
        run: |
          python3 tools/run_android_background_tests.py \
            --candidate-dir "$RUNNER_TEMP/lightforge-ci-candidate" \
            --output-dir "$LIGHTFORGE_ANDROID_EVIDENCE_ROOT/background" \
            --emulator-log "$RUNNER_TEMP/lightforge-android-emulator.log" \
            --candidate-artifact-id "${{ needs.verify.outputs.candidate_artifact_id }}" \
            --candidate-artifact-digest "${{ needs.verify.outputs.candidate_artifact_digest }}" \
            --candidate-run-id "${{ needs.verify.outputs.candidate_run_id }}" \
            --candidate-run-attempt "${{ needs.verify.outputs.candidate_run_attempt }}" \
            --candidate-evidence-session "${{ needs.verify.outputs.candidate_evidence_session }}" \
            --candidate-identity-sha256 "${{ needs.verify.outputs.candidate_identity_sha256 }}" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" --evidence-session "${{ steps.android_session.outputs.session }}"
      - name: Verify crash trace recovery and diagnostic export to Downloads
        run: |
          python3 tools/run_android_diagnostics_tests.py \
            --candidate-dir "$RUNNER_TEMP/lightforge-ci-candidate" \
            --output-dir "$LIGHTFORGE_ANDROID_EVIDENCE_ROOT/diagnostics" \
            --emulator-log "$RUNNER_TEMP/lightforge-android-emulator.log" \
            --candidate-artifact-id "${{ needs.verify.outputs.candidate_artifact_id }}" \
            --candidate-artifact-digest "${{ needs.verify.outputs.candidate_artifact_digest }}" \
            --candidate-run-id "${{ needs.verify.outputs.candidate_run_id }}" \
            --candidate-run-attempt "${{ needs.verify.outputs.candidate_run_attempt }}" \
            --candidate-evidence-session "${{ needs.verify.outputs.candidate_evidence_session }}" \
            --candidate-identity-sha256 "${{ needs.verify.outputs.candidate_identity_sha256 }}" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" --evidence-session "${{ steps.android_session.outputs.session }}"
      - name: Seal fresh Android instrumentation evidence
        run: |
          python3 tools/android_evidence_manifest.py write \
            --output-dir "$LIGHTFORGE_ANDROID_EVIDENCE_ROOT/accepted" \
            --background-receipt "$LIGHTFORGE_ANDROID_EVIDENCE_ROOT/background/android-background-verification.json" \
            --diagnostics-receipt "$LIGHTFORGE_ANDROID_EVIDENCE_ROOT/diagnostics/android-diagnostics-verification.json" \
            --candidate-dir "$RUNNER_TEMP/lightforge-ci-candidate" \
            --candidate-artifact-id "${{ needs.verify.outputs.candidate_artifact_id }}" \
            --candidate-artifact-digest "${{ needs.verify.outputs.candidate_artifact_digest }}" \
            --candidate-run-id "${{ needs.verify.outputs.candidate_run_id }}" \
            --candidate-run-attempt "${{ needs.verify.outputs.candidate_run_attempt }}" \
            --candidate-evidence-session "${{ needs.verify.outputs.candidate_evidence_session }}" \
            --candidate-identity-sha256 "${{ needs.verify.outputs.candidate_identity_sha256 }}" \
            --release "$LIGHTFORGE_RELEASE" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --head-sha "$GITHUB_SHA" \
            --evidence-session "${{ steps.android_session.outputs.session }}"
      - name: Retain sealed Android release evidence
        id: upload_android_evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lightforge-${{ env.LIGHTFORGE_RELEASE }}-android-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LIGHTFORGE_ANDROID_EVIDENCE_ROOT }}/accepted
          if-no-files-found: error
          retention-days: 30
      - name: Collect Android diagnostics outside release evidence
        if: always()
        run: |
          debug_root="$RUNNER_TEMP/lightforge-android-debug-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$debug_root"
          if [ -d "$LIGHTFORGE_ANDROID_EVIDENCE_ROOT" ]; then cp -a "$LIGHTFORGE_ANDROID_EVIDENCE_ROOT/." "$debug_root/"; fi
          if [ -f "$RUNNER_TEMP/lightforge-android-emulator.log" ]; then cp "$RUNNER_TEMP/lightforge-android-emulator.log" "$debug_root/emulator.log"; fi
      - name: Retain Android diagnostics (not release evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lightforge-${{ env.LIGHTFORGE_RELEASE }}-android-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lightforge-android-debug-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
