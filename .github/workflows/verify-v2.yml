name: LightForge production verification
on:
  push:
    branches: [main, 'development/2.0', 'development/2.1']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-v2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            android
            web
            tools
            tests
            qa
            research/model-source
            research/upstream/deux
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce bundled production models
        run: |
          python3 -m pip install --no-cache-dir torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --no-cache-dir -r tools/model-requirements.txt
          python3 tools/prepare_game.py
          python3 tools/prepare_deux.py
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node qa/release-2.1.0/browser.cjs
      - name: Prepare licensed reference excerpts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p qa/release-1.6.0/fixtures
          curl -fL --retry 3 https://github.com/sigsep/sigsep-mus-db/releases/download/v0.4.0/MUSDB18-7-STEMS.zip -o qa/release-1.6.0/fixtures/MUSDB18-7-STEMS.zip
          echo '365f66acffc57282e474a4c24b32afec3678258c50b8d45646ac849b0a287df3  qa/release-1.6.0/fixtures/MUSDB18-7-STEMS.zip' | sha256sum -c
          python3 qa/release-1.6.0/prepare-musdb-fixtures.py
      - name: Actual offline model pipeline and cancellation
        run: node qa/release-2.1.0/analysis-browser.cjs
      - run: python3 tools/bootstrap_toolchain.py
      - name: Build CI package with an ephemeral signing identity
        run: |
          set -o pipefail
          df -h .
          env -u ANDROID_SDK_ROOT -u ANDROID_HOME LIGHTFORGE_ALLOW_NEW_SIGNING=1 LIGHTFORGE_SIGNING_DIR="$RUNNER_TEMP/ci-signing" bash build.sh 2>&1 | tee qa/release-2.1.0/ci-build.log
          df -h .
      - name: Native storage and sequence validation
        run: env -u ANDROID_SDK_ROOT -u ANDROID_HOME python3 tests/verify_native_release.py --release 2.1.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightforge-2.1-verification
          path: |
            qa/release-2.1.0/*.json
            qa/release-2.1.0/*.log
            qa/release-2.1.0/*.txt
            qa/release-2.1.0/*.png
          retention-days: 30
      - name: Retain verified candidate for local release signing
        uses: actions/upload-artifact@v4
        with:
          name: lightforge-2.1-ci-candidate
          path: |
            dist/LightForge-2.1.0.apk
            dist/LightForge-2.1.0.apk.json
            dist/LightForge-2.1.0.apk.sha256
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
