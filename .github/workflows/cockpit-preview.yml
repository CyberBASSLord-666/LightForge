name: Cockpit visual integration
on:
  push:
    branches: ['development/2.1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read current release version
        run: |
          python3 - <<'PYVERSION'
          import json,os
          version=json.load(open('version.json'))['name']
          assert len(version.split('.'))==3 and all(p.isdigit() for p in version.split('.'))
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('LIGHTFORGE_RELEASE='+version+'\n')
          PYVERSION
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node qa/release-${{ env.LIGHTFORGE_RELEASE }}/browser.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cockpit-visual-review
          path: |
            qa/release-${{ env.LIGHTFORGE_RELEASE }}/*.png
            qa/release-${{ env.LIGHTFORGE_RELEASE }}/browser-*.json
