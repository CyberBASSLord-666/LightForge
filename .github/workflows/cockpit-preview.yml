name: Cockpit visual integration
on:
  push:
    branches: ['development/2.1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node qa/release-2.1.0/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cockpit-visual-review
          path: |
            qa/release-2.1.0/*.png
            qa/release-2.1.0/browser-*.json
