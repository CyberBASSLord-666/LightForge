name: Publish verified signed release
on:
  push:
    branches: [main]
    paths:
      - 'releases/v*/request.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: lightforge-release-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'CyberBASSLord-666/LightForge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            .github
            android
            web
            tools
            tests
            qa
            releases
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 tools/bootstrap_toolchain.py
      - name: Verify provenance, reconstruct exact signed APK and publish
        run: |
          request="$(python3 -c 'import json; print("releases/v"+json.load(open("version.json"))["name"]+"/request.json")')"
          python3 tools/publish_github_release.py "$request"
