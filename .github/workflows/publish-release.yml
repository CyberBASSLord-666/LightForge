name: Publish verified signed release
on:
  push:
    branches: [main]
    paths:
      - 'releases/v*/request.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: lightforge-release-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'CyberBASSLord-666/LightForge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            .github
            android
            web
            tools
            tests
            qa
            releases
            research/evaluation-1.6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Restore source-bound GAME graphs and licensed reference fixtures
        run: |
          python3 -m pip install --no-cache-dir onnx==1.20.1 numpy==2.5.3 scipy==1.18.1
          python3 tools/prepare_game.py
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p qa/release-1.6.0/fixtures
          curl -fL --retry 3 https://github.com/sigsep/sigsep-mus-db/releases/download/v0.4.0/MUSDB18-7-STEMS.zip -o qa/release-1.6.0/fixtures/MUSDB18-7-STEMS.zip
          echo '365f66acffc57282e474a4c24b32afec3678258c50b8d45646ac849b0a287df3  qa/release-1.6.0/fixtures/MUSDB18-7-STEMS.zip' | sha256sum -c
          python3 qa/release-1.6.0/prepare-musdb-fixtures.py
      - run: python3 tools/bootstrap_toolchain.py
      - name: Verify provenance, reconstruct exact signed APK and publish
        run: |
          request="$(python3 -c 'import json; print("releases/v"+json.load(open("version.json"))["name"]+"/request.json")')"
          python3 tools/publish_github_release.py "$request"
